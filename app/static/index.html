<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gmail MCP Assistant</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; margin:0; background:#f5f7fb; color:#172033; }
    .wrap { max-width:1000px; margin:40px auto; padding:0 20px; }
    .card { background:white; border-radius:18px; box-shadow:0 8px 30px #00000012; padding:24px; }
    h1 { margin-top:0; }
    .subtitle { color:#667085; }
    #chat { min-height:420px; max-height:560px; overflow:auto; padding:12px 0; }
    .msg { padding:12px 15px; border-radius:14px; margin:10px 0; white-space:pre-wrap; }
    .user { background:#e9efff; margin-left:20%; }
    .assistant { background:#f1f3f5; margin-right:20%; }
    .row { display:flex; gap:10px; }
    textarea { flex:1; min-height:70px; resize:vertical; padding:12px; border:1px solid #d0d5dd; border-radius:12px; }
    button { border:0; border-radius:12px; padding:12px 18px; cursor:pointer; background:#172033; color:white; }
    .examples { display:flex; flex-wrap:wrap; gap:8px; margin:12px 0 18px; }
    .example { background:#eef2f6; color:#172033; }
    #status { color:#667085; font-size:14px; margin-top:8px; }
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Gmail MCP Assistant</h1>
    <div class="subtitle">Natural-language Gmail actions through an MCP client and Gmail MCP server.</div>

    <div class="examples">
      <button class="example" onclick="useExample('Search my unread emails from the last week')">Search unread</button>
      <button class="example" onclick="useExample('Find emails from example@gmail.com about the project')">Filter</button>
      <button class="example" onclick="useExample('Send a test email to YOUR_EMAIL@example.com with subject MCP Gmail Test and body Hello from my MCP assignment.')">Send test</button>
      <button class="example" onclick="useExample('Reply to message ID PASTE_ID_HERE saying Thanks, I received your email.')">Reply</button>
    </div>

    <div id="chat"></div>

    <div class="row">
      <textarea id="input" placeholder="Ask your Gmail assistant..."></textarea>
      <button onclick="sendMessage()">Send</button>
    </div>
    <div id="status"></div>
  </div>
</div>

<script>
function addMessage(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  div.scrollIntoView({behavior:"smooth"});
}

function useExample(text) {
  document.getElementById("input").value = text;
}

async function sendMessage() {
  const input = document.getElementById("input");
  const message = input.value.trim();
  if (!message) return;

  addMessage("user", message);
  input.value = "";
  document.getElementById("status").textContent = "Running MCP + Gmail...";

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify({message})
    });
    const data = await res.json();
    addMessage("assistant", data.answer || "No response");
    if (data.tools_used?.length) {
      document.getElementById("status").textContent =
        "MCP tools used: " + data.tools_used.join(", ");
    } else {
      document.getElementById("status").textContent = "";
    }
  } catch (e) {
    addMessage("assistant", "Request failed: " + e);
    document.getElementById("status").textContent = "";
  }
}

document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
</script>
</body>
</html>
